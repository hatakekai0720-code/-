<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>X-T3 Cinematic Lab</title>
<script>
// テーマを描画前に適用する（ちらつき防止）。詳細は js/ui/theme.js
try {
  var t = (JSON.parse(localStorage.getItem('xt3cine:db')) || {}).settings.theme;
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X-T3 Lab">
<meta name="description" content="FUJIFILM X-T3 のレシピ管理・画像解析・ロケ地マップ・撮影講座。完全オフラインで動作します。">
</head>
<body>
<header class="app-header">
  <button type="button" id="back-btn" class="icon-btn" aria-label="戻る" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="page-title">X-T3 Cinematic Lab</h1>
  <a href="#/settings" class="icon-btn" aria-label="設定">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
  </a>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="メインナビゲーション">
  <a href="#/analyze" data-tab="analyze">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 20V11M10 20V5M14 20v-7M18 20V8"/></svg><span>解析</span>
  </a>
  <a href="#/recipes" data-tab="recipes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>レシピ</span>
  </a>
  <a href="#/map" data-tab="map">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6.2-6-11a6 6 0 0112 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span>地図</span>
  </a>
  <a href="#/academy" data-tab="academy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c2 2 10 2 12 0v-4.5"/></svg><span>講座</span>
  </a>
  <a href="#/slots" data-tab="slots">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg><span class="num">C1-C7</span>
  </a>
</nav>

<div id="toast-root" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
